<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snowfall</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  /* Standalone demo in a normal browser gets a night sky so white flakes are visible.
     The macOS overlay loads index.html?overlay=1 and stays fully transparent. */
  body.demo { background: radial-gradient(120% 90% at 50% 0%, #1b2a4a 0%, #0a0f1c 60%, #05070d 100%); }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .mode {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    padding: 9px 10px 9px 16px; border-radius: 999px;
    background: rgba(16, 22, 34, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(12px);
    color: #eaf1ff; font: 13px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    white-space: nowrap;
  }
  .mode[hidden] { display: none; }
  .mode strong { font-weight: 650; }
  .mode button {
    font: inherit; font-weight: 600; color: #0e1420; background: #eaf1ff;
    border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer;
  }
  .mode button:hover { background: #ffffff; }
  .mode button:focus-visible { outline: 2px solid #8fb6ff; outline-offset: 2px; }
  @media (prefers-reduced-transparency: reduce) {
    .mode { background: #101622; backdrop-filter: none; }
  }

  .hint {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    font: 500 13px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif;
    color: #cfe0ff; opacity: .55; letter-spacing: .02em; text-align: center;
    pointer-events: none; display: none;
  }
  body.demo .hint { display: block; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="mode" class="mode" role="status" aria-live="polite" hidden>
  <span><strong>Snowball Mode</strong> · drag the snow to roll a ball · stack two for a snowman</span>
  <button id="leave" type="button">Leave</button>
</div>
<p class="hint">1 / 2 / 3 changes how hard it snows &nbsp;·&nbsp; P sends the plough
  &nbsp;·&nbsp; drag the snow to roll a snowball</p>
<script>
(() => {
  "use strict";
  const overlay = new URLSearchParams(location.search).has("overlay");
  if (!overlay) document.body.classList.add("demo");

  const canvas = document.getElementById("sky");
  const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });

  // Snow that has landed, as a height in pixels every COL_W across the screen. This is
  // deliberately slow: at the default rate a Medium snowfall lays down roughly 15px an
  // hour, so a proper drift along the bottom of the screen is an evening's work.
  const COL_W = 4;
  const REPOSE = Math.tan(20 * Math.PI / 180) * 4;   // the steepest face a drift keeps
  // How a landed flake spreads over its neighbours. A flake that lands in one 4px
  // column builds a spike; spread over five it builds a curve.
  const DEPOSIT = [0.1, 0.2, 0.4, 0.2, 0.1];
  let pile = new Float32Array(0);
  let scratch = new Float32Array(0);
  let pileCap = 0;

  // Everything the native side (or the settings window) is allowed to change.
  const settings = {
    settle: true,            // whether snow lies at all
    maxDepthPercent: 100,    // how much of the screen the snow may bury
    autoPlowPercent: 0,      // plough itself at this depth; 0 = only when asked
    plowCrossSeconds: 7,     // how long the truck takes to cross the screen
    truckPercent: 7,         // truck height as a share of the screen
    plowDirection: 0         // 0 alternate, 1 left to right, -1 right to left
  };

  let w = 0, h = 0, dpr = 1;
  let powerSaver = false;
  let paused = false;

  // Declared up here because the very first sync() reads it, long before the frame-rate
  // code further down would have got round to defining it.
  const calmQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  let calm = calmQuery.matches;

  // Backing-store pixels are the biggest single GPU cost here. Small white dots do not
  // need the full Retina scale, so cap at 1.5x, or 1x while saving power: on a 5K
  // display that is well under half the pixels of a naive devicePixelRatio canvas.
  function dprCap() { return powerSaver ? 1 : 1.5; }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, dprCap());
    const cw = Math.floor(window.innerWidth * dpr);
    const ch = Math.floor(window.innerHeight * dpr);
    if (cw === canvas.width && ch === canvas.height) return false;
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = cw;
    canvas.height = ch;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // a resize clears the canvas and its transform
    rebuildPile();
    return true;
  }

  // Resizing reallocates the backing store, and a window dragged between displays
  // fires dozens of resize events, so coalesce bursts into one rebuild.
  let resizeTimer = 0;
  function onViewportChange() {
    if (resize()) sync(false);
  }
  resize();
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(onViewportChange, 150);
  });

  // Flake count scales with the area of the screen, so a 6K display is not sparse.
  const TAU = Math.PI * 2;
  const G = 400;                // px/s² — gravity, in screen units
  // Flakes are drawn in a few fixed opacities rather than one each, so a frame is a
  // handful of fills instead of three canvas state changes per flake.
  const BUCKETS = 5;
  const buckets = Array.from({ length: BUCKETS }, () => []);

  const PRESETS = { 1: 0.45, 2: 1, 3: 2.2 };
  let intensity = 1;
  let flakes = [];

  const rand = (a, b) => a + Math.random() * (b - a);

  function targetCount() {
    const easing = (powerSaver ? 0.55 : 1) * (calm ? 0.5 : 1);
    return Math.round(((w * h) / 9000) * intensity * easing);
  }

  function makeFlake(seeded) {
    // depth: 0 = far away (small, slow, faint), 1 = close to the glass
    const depth = Math.pow(Math.random(), 1.6);
    return {
      x: rand(-40, w + 40),
      y: seeded ? rand(-h, h) : rand(-60, -10),
      depth,
      r: 0.7 + depth * 2.6,
      term: 14 + depth * 46,          // terminal velocity, px/s — big flakes fall faster
      vy: seeded ? 14 + depth * 46 : 0,
      vx: 0,
      sway: rand(10, 34) * (0.4 + depth),
      phase: rand(0, Math.PI * 2),
      spin: rand(0.4, 1.3),
      crystal: depth > 0.72,          // only the nearest flakes show their arms
      bucket: Math.min(BUCKETS - 1, Math.floor((0.28 + depth * 0.62) * BUCKETS))
    };
  }

  function sync(seeded) {
    const want = targetCount();
    while (flakes.length < want) flakes.push(makeFlake(seeded));
    if (flakes.length > want) flakes.length = want;
  }
  sync(true);

  // ---- snow on the ground -------------------------------------------------

  // Keeps whatever has already settled when the screen changes size, by resampling the
  // old heights across the new column count rather than throwing away the drift.
  function rebuildPile() {
    // One column past the right edge, so the drift reaches it instead of stopping a
    // few pixels short.
    const n = Math.max(2, Math.ceil(w / COL_W) + 1);
    const next = new Float32Array(n);
    if (pile.length) {
      for (let i = 0; i < n; i++) {
        next[i] = pile[Math.min(pile.length - 1, Math.floor(i * pile.length / n))];
      }
    }
    pile = next;
    scratch = new Float32Array(n);
    applyDepthCap();
  }

  // Everything is a share of the screen rather than a count of pixels: 100% means the
  // snow is allowed to bury the display completely.
  function applyDepthCap() {
    const percent = Number.isFinite(settings.maxDepthPercent) ? settings.maxDepthPercent : 100;
    pileCap = h * (Math.max(1, Math.min(100, percent)) / 100);
    for (let i = 0; i < pile.length; i++) if (pile[i] > pileCap) pile[i] = pileCap;
  }

  function column(x) {
    if (x < 0) return 0;
    if (x >= w) return pile.length - 1;
    return (x / COL_W) | 0;
  }

  // What one landed flake is worth, as a fraction of screen height so it behaves the
  // same on every display. How fast the snow builds is then simply how hard it is
  // snowing: Blizzard buries the screen in a couple of hours, Light takes all night.
  function perFlake() { return h * 0.004; }

  // Weighted so a big near flake counts for more, normalised by the average weight
  // (0.835) so the weighting does not change how fast things fill. The kernel sums to
  // 1, so spreading a landing over five columns does not change the depth laid down.
  function depositAt(arr, ci, depth, cap) {
    if (!settings.settle || arr[ci] >= cap) return;
    const amount = perFlake() * (0.45 + depth) / 0.835;
    for (let k = -2; k <= 2; k++) {
      const i = ci + k;
      if (i >= 0 && i < arr.length) arr[i] = Math.min(cap, arr[i] + amount * DEPOSIT[k + 2]);
    }
  }

  function land(ci, depth) { depositAt(pile, ci, depth, pileCap); }

  // Snow does not stand in towers: anything steeper than REPOSE slumps onto its
  // neighbour, which is also what spreads out the ridge a plough leaves behind.
  function settle(dt) {
    creep(pile, scratch, dt);
    for (const ledge of ledges.values()) {
      creep(ledge.snow, ledge.scratch, dt);
      // Nothing holds snow on at the ends of a window, so it tips off the edges.
      const n = ledge.snow.length;
      const keep = Math.max(0, 1 - dt * 3);     // same tipping rate at any frame rate
      ledge.snow[0] *= keep;
      ledge.snow[n - 1] *= keep;
    }
  }

  function creep(pile, scratch, dt) {
    const n = pile.length;
    if (n < 3) return;

    // Creep: lying snow slumps gently toward its neighbours. This is what turns a row
    // of little peaks into the long shallow curves a real drift has. It moves snow
    // sideways without creating or destroying any, so the fill time stays honest.
    const k = Math.min(0.24, dt * 7);
    scratch.set(pile);
    for (let i = 1; i < n - 1; i++) {
      pile[i] = scratch[i] + k * (scratch[i - 1] + scratch[i + 1] - 2 * scratch[i]);
    }
    pile[0] = scratch[0] + k * (scratch[1] - scratch[0]);
    pile[n - 1] = scratch[n - 1] + k * (scratch[n - 2] - scratch[n - 1]);

    // Avalanche: anything still steeper than the repose angle lets go.
    const give = Math.min(1, dt * 9) * 0.25;
    for (let i = 0; i < pile.length - 1; i++) {
      const d = pile[i] - pile[i + 1];
      if (d > REPOSE) {
        const move = (d - REPOSE) * give;
        pile[i] -= move; pile[i + 1] += move;
      } else if (d < -REPOSE) {
        const move = (-d - REPOSE) * give;
        pile[i] += move; pile[i + 1] -= move;
      }
    }
  }

  // ---- snow on windows ----------------------------------------------------

  // The app sends the top edge of every window on this screen, along with the parts of
  // that edge which are actually visible. Snow lands on them and rides along when the
  // window is moved, because the height map is keyed to the window, not to a position.
  const ledges = new Map();

  function ledgeCap() { return h * 0.05; }

  window.setLedges = (list) => {
    const seen = new Set();
    for (const l of list || []) {
      seen.add(l.id);
      const cols = Math.max(2, Math.ceil(l.w / COL_W));
      let ledge = ledges.get(l.id);
      if (!ledge) {
        ledge = { snow: new Float32Array(cols), scratch: new Float32Array(cols) };
        ledges.set(l.id, ledge);
      } else if (ledge.snow.length !== cols) {
        const next = new Float32Array(cols);
        for (let i = 0; i < cols; i++) {
          next[i] = ledge.snow[Math.min(ledge.snow.length - 1,
                                        Math.floor((i * ledge.snow.length) / cols))];
        }
        ledge.snow = next;
        ledge.scratch = new Float32Array(cols);
      }
      ledge.x = l.x; ledge.y = l.y; ledge.w = l.w;
      ledge.spans = (l.spans && l.spans.length) ? l.spans : [[0, l.w]];
    }
    for (const id of [...ledges.keys()]) if (!seen.has(id)) ledges.delete(id);
  };

  function onVisibleSpan(ledge, offset) {
    for (const span of ledge.spans) if (offset >= span[0] && offset <= span[1]) return true;
    return false;
  }

  // Does this flake come to rest on a window instead of reaching the ground?
  function landOnLedge(f) {
    for (const ledge of ledges.values()) {
      if (f.x < ledge.x || f.x > ledge.x + ledge.w) continue;
      const offset = f.x - ledge.x;
      if (!onVisibleSpan(ledge, offset)) continue;
      const ci = Math.min(ledge.snow.length - 1, Math.max(0, (offset / COL_W) | 0));
      const surface = ledge.y - ledge.snow[ci];
      if (f.y + f.r >= surface && f.y - f.r < surface + 22) {
        depositAt(ledge.snow, ci, f.depth, ledgeCap());
        return true;
      }
    }
    return false;
  }

  // ---- snowballs and snowmen ----------------------------------------------

  // Only live while Snowball Mode is on, because the overlay has to stop being
  // click-through to hear a mouse at all.
  const balls = [];
  let interactive = false;
  let grabbed = null;

  const bridge = () => window.webkit && window.webkit.messageHandlers
    && window.webkit.messageHandlers.snowfall;

  const banner = document.getElementById("mode");

  function leaveSnowballMode() {
    const b = bridge();
    if (b) b.postMessage({ type: "exitSnowball" });
    window.setInteractive(false);
  }

  document.getElementById("leave").addEventListener("click", leaveSnowballMode);

  window.setInteractive = (on) => {
    interactive = !!on;
    // Say so on screen. A mode that silently swallows every click has to announce
    // itself, and offer a way out that is not a hunt through the menu bar.
    if (banner) banner.hidden = !interactive || !bridge();
    if (!interactive) releaseGrab();   // never leave a ball stranded in mid-air
    document.body.style.cursor = interactive ? "grab" : "default";
  };

  function groundAt(x) { return h - pile[column(x)]; }

  function ballAt(x, y) {
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      const reach = b.r + 12;        // a little margin, or small balls are unhittable
      if ((x - b.x) ** 2 + (y - b.y) ** 2 <= reach * reach) return b;
    }
    return null;
  }

  // Everything you were holding is let go here, and only here: it drops from where it
  // is, with no sideways speed, so nothing is ever flung across the screen.
  function releaseGrab() {
    if (!grabbed) return;
    for (const b of grabbed.group) {
      b.held = false;
      b.resting = false;
      b.vx = 0;
      b.vy = 0;
    }
    grabbed = null;
    document.body.style.cursor = interactive ? "grab" : "default";
  }

  // Rolling picks the snow up off the ground and turns it into volume: the ball grows
  // by the area it sweeps away, so a long roll through deep snow makes a big ball and
  // leaves a clean track behind it.
  function rollThrough(b, dx) {
    const distance = Math.abs(dx);
    if (!distance) return;
    b.rot += dx / Math.max(6, b.r);

    const i0 = Math.max(0, column(b.x - b.r));
    const i1 = Math.min(pile.length - 1, column(b.x + b.r));
    let taken = 0;
    for (let i = i0; i <= i1; i++) {
      const bite = Math.min(pile[i], distance * 0.3);
      pile[i] -= bite;
      taken += bite * COL_W;
    }
    if (taken > 0) {
      const area = Math.PI * b.r * b.r + taken * 0.75;
      b.r = Math.min(h * 0.13, Math.sqrt(area / Math.PI));
    }
  }

  // What a ball would come to rest on at its current x: the ground, or the top of the
  // ball below it.
  function supportFor(b) {
    let surface = groundAt(b.x);
    let on = null;
    for (const other of balls) {
      if (other === b || other.held || !other.resting) continue;
      // Only something underneath can hold a ball up. Without this test the lower ball
      // of a stack treats the one above it as a surface, climbs onto it, and the pair
      // leapfrog each other off the top of the screen.
      if (other.y <= b.y) continue;
      if (Math.abs(other.x - b.x) < other.r * 0.95) {
        const top = other.y - other.r;
        if (top < surface) { surface = top; on = other; }
      }
    }
    return { y: surface, on };
  }

  // Dropped balls fall rather than appear: the same gravity as the flakes, and nothing
  // ever hangs in the air. If the ground under a ball is ploughed away, or the ball it
  // was standing on is picked up, it stops resting and comes down.
  // The impact a packed ball cannot survive. With gravity at G this is reached after
  // falling about 110px, so lifting a snowman and dropping it breaks it, while setting
  // one down gently, or the ground being ploughed from under it, does not.
  const BREAK_SPEED = 300;

  function updateBalls(dt) {
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      if (b.held) continue;

      const support = supportFor(b);
      const restY = support.y - b.r;

      if (b.resting) {
        if (b.y < restY - 1.5) { b.resting = false; b.vy = 0; }
        else { b.y = restY; continue; }
      }

      b.vy += G * dt;
      b.vx *= Math.max(0, 1 - dt * 2.5);       // air drag; nothing sails off
      b.y += b.vy * dt;
      b.x += b.vx * dt;
      b.rot += (b.vx * dt) / Math.max(6, b.r);

      // The screen has edges. A ball that reaches one stops there.
      if (b.x < b.r) { b.x = b.r; b.vx = 0; }
      else if (b.x > w - b.r) { b.x = w - b.r; b.vx = 0; }
      if (b.y < b.r) { b.y = b.r; if (b.vy < 0) b.vy = 0; }

      if (b.y >= restY) {
        if (b.vy > BREAK_SPEED) {
          shatter(b);
          b.doomed = true;
          // Landing hard on top of something takes that apart as well, so dropping a
          // ball onto a snowman knocks the snowman down.
          if (support.on && b.vy > BREAK_SPEED * 1.15) {
            shatter(support.on);
            support.on.doomed = true;
          }
          continue;
        }
        b.y = restY;
        b.vx = 0;
        b.vy = 0;
        b.resting = true;
        if (support.on) b.x = support.on.x;      // tidy the stack as it is built
      }
    }

    for (let i = balls.length - 1; i >= 0; i--) if (balls[i].doomed) balls.splice(i, 1);
  }

  // A ball that hits hard stops being a ball: its volume goes back into the ground as
  // a mound, with a burst of loose snow.
  function shatter(b) {
    const area = Math.PI * b.r * b.r;
    const spread = Math.max(3, Math.round((b.r * 2.6) / COL_W));
    const start = column(b.x) - (spread >> 1);
    const perColumn = area / (spread * COL_W);
    for (let k = 0; k < spread; k++) {
      const i = start + k;
      if (i < 0 || i >= pile.length) continue;
      const weight = 1 - Math.abs(k - spread / 2) / (spread / 2);
      pile[i] = Math.min(pileCap, pile[i] + perColumn * (0.55 + weight));
    }
    const lumps = Math.min(44, 14 + (b.r | 0));
    for (let n = 0; n < lumps && spray.length < 150; n++) {
      spray.push({
        x: b.x + rand(-b.r, b.r),
        y: b.y + rand(-b.r, b.r * 0.4),
        vx: rand(-220, 220),
        vy: -rand(60, 260),
        r: rand(1, 2.6),
        life: 1
      });
    }
  }

  // A snowman is a stack, and a stack moves as one piece: take hold of any part of it
  // and the rest comes too.
  function stackOf(ball) {
    const group = new Set([ball]);
    let added = true;
    while (added) {
      added = false;
      for (const candidate of balls) {
        if (group.has(candidate)) continue;
        for (const member of group) {
          const aligned =
            Math.abs(candidate.x - member.x) < Math.max(candidate.r, member.r) * 0.85;
          const touching =
            Math.abs(Math.abs(candidate.y - member.y) - (candidate.r + member.r)) < 10;
          if (aligned && touching) { group.add(candidate); added = true; break; }
        }
      }
    }
    return [...group];
  }

  function stackUnder(b) {
    let count = 1, current = b, guard = 0;
    while (guard++ < 8) {
      const below = balls.find((o) => o !== current && o.resting
        && Math.abs(o.x - current.x) < o.r * 0.7
        && Math.abs((o.y - o.r) - (current.y + current.r)) < 8);
      if (!below) break;
      count++;
      current = below;
    }
    return count;
  }

  function hasBallOn(b) {
    return balls.some((o) => o !== b && o.resting
      && Math.abs(o.x - b.x) < b.r * 0.7
      && Math.abs((b.y - b.r) - (o.y + o.r)) < 8);
  }

  function drawBalls() {
    for (const b of balls) {
      // What it is standing on, darkened under it. Without a contact shadow a ball
      // looks pasted on rather than resting.
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = "#43536e";
      ctx.beginPath();
      ctx.ellipse(b.x, Math.min(h, b.y + b.r) + 1, b.r * 0.95,
                  Math.max(2, b.r * 0.2), 0, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;

      const shade = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.4, b.r * 0.15,
                                             b.x, b.y, b.r);
      shade.addColorStop(0, "#ffffff");
      shade.addColorStop(1, "#c9d6e8");
      ctx.fillStyle = shade;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();

      // The same grain as the ground, clipped to the ball: packed snow, not plastic.
      if (grain) {
        ctx.save();
        ctx.clip();
        ctx.fillStyle = grain;
        ctx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
        ctx.restore();
      }

      ctx.strokeStyle = "rgba(255,255,255,0.9)";      // rim light along the top edge
      ctx.lineWidth = Math.max(0.8, b.r * 0.055);
      ctx.beginPath();
      ctx.arc(b.x, b.y, Math.max(1, b.r - ctx.lineWidth / 2), Math.PI * 1.08, Math.PI * 1.78);
      ctx.stroke();

      // A speck of grit so you can see it turning as it rolls.
      ctx.fillStyle = "rgba(150,170,195,0.5)";
      ctx.beginPath();
      ctx.arc(b.x + Math.cos(b.rot) * b.r * 0.55, b.y + Math.sin(b.rot) * b.r * 0.55,
              Math.max(1, b.r * 0.08), 0, TAU);
      ctx.fill();

      const height = stackUnder(b);
      if (height >= 2 && !hasBallOn(b)) drawFace(b);
      else if (height === 2 && hasBallOn(b)) drawButtons(b);
    }
  }

  function drawFace(b) {
    const r = b.r;
    ctx.fillStyle = "#1d2430";
    for (const side of [-0.33, 0.33]) {
      ctx.beginPath();
      ctx.arc(b.x + side * r, b.y - r * 0.25, Math.max(1.2, r * 0.1), 0, TAU);
      ctx.fill();
    }
    ctx.beginPath();                       // carrot
    ctx.moveTo(b.x, b.y - r * 0.02);
    ctx.lineTo(b.x + r * 0.62, b.y + r * 0.07);
    ctx.lineTo(b.x, b.y + r * 0.16);
    ctx.closePath();
    ctx.fillStyle = "#e8822c";
    ctx.fill();
    ctx.fillStyle = "#1d2430";             // a coal smile
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.arc(b.x + i * r * 0.17, b.y + r * 0.42 + Math.abs(i) * r * 0.045,
              Math.max(0.9, r * 0.055), 0, TAU);
      ctx.fill();
    }
  }

  function drawButtons(b) {
    ctx.fillStyle = "#1d2430";
    for (const dy of [-0.3, 0, 0.3]) {
      ctx.beginPath();
      ctx.arc(b.x, b.y + dy * b.r, Math.max(1, b.r * 0.07), 0, TAU);
      ctx.fill();
    }
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (!interactive) return;
    if (grabbed) releaseGrab();        // a release we never heard about
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch { /* not capturable */ }
    }
    const hit = ballAt(e.clientX, e.clientY);

    if (hit) {
      const group = stackOf(hit);
      for (const b of group) { b.held = true; b.resting = false; b.vx = 0; b.vy = 0; }
      grabbed = {
        mode: "carry",
        group,
        offsets: group.map((b) => ({ dx: b.x - e.clientX, dy: b.y - e.clientY }))
      };
    } else {
      // Only snow makes snowballs. Clicking the empty desktop does nothing at all,
      // rather than conjuring a ball out of thin air down on the drift.
      const ci = column(e.clientX);
      const surface = h - pile[ci];
      if (pile[ci] < 1.5 || e.clientY < surface - 60) return;

      const ball = { x: e.clientX, y: groundAt(e.clientX) - 9, r: 9, rot: 0,
                     vx: 0, vy: 0, held: true, resting: false };
      balls.push(ball);
      grabbed = { mode: "roll", group: [ball], lastX: e.clientX };
    }
    document.body.style.cursor = "grabbing";
  });

  window.addEventListener("pointermove", (e) => {
    if (!grabbed) return;
    if (e.buttons === 0) { releaseGrab(); return; }   // a release we never heard about

    if (grabbed.mode === "carry") {
      grabbed.group.forEach((b, i) => {
        b.x = Math.max(b.r, Math.min(w - b.r, e.clientX + grabbed.offsets[i].dx));
        b.y = Math.max(b.r, e.clientY + grabbed.offsets[i].dy);
      });
    } else {
      const b = grabbed.group[0];
      const x = Math.max(b.r, Math.min(w - b.r, e.clientX));
      rollThrough(b, x - grabbed.lastX);
      grabbed.lastX = x;
      b.x = x;
      b.y = groundAt(b.x) - b.r;
    }
  });

  window.addEventListener("pointerup", releaseGrab);
  window.addEventListener("pointercancel", releaseGrab);
  window.addEventListener("blur", releaseGrab);   // focus lost mid-drag

  // A double click is a second way out, for when the menu is awkward to reach.
  canvas.addEventListener("dblclick", () => {
    if (interactive) leaveSnowballMode();
  });

  // Escape is the way out of a mode that is swallowing every click.
  // In a browser there is no mode to switch: the demo is always playable.
  if (!overlay) window.setInteractive(true);

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && interactive) leaveSnowballMode();
  });

  // ---- the plough ---------------------------------------------------------

  let plow = null;
  let lastDir = -1;

  const TRUCK_HEIGHT = 51;        // px tall at scale 1, roof light included

  window.sendPlow = (dir) => {
    const d = dir || settings.plowDirection || -lastDir || 1;
    lastDir = d;
    const scale = (settings.truckPercent / 100 * h) / TRUCK_HEIGHT;
    plow = { dir: d, x: d > 0 ? -110 * scale : w + 110 * scale, scale, carry: 0, wheel: 0 };
  };

  function updatePlow(dt) {
    if (!plow) return;
    const p = plow;
    const speed = w / Math.max(1, settings.plowCrossSeconds);
    p.x += p.dir * speed * dt;
    p.wheel += (p.dir * speed * dt) / (9 * p.scale);

    // The blade scrapes what it covers down to a thin crust, and what it takes is not
    // deleted: it rides in front of the truck as a bank that grows across the screen.
    const front = p.x + p.dir * 36 * p.scale;
    const a = Math.min(p.x - 26 * p.scale, front);
    const b = Math.max(p.x - 26 * p.scale, front);
    const i0 = Math.max(0, Math.floor(a / COL_W));
    const i1 = Math.min(pile.length - 1, Math.ceil(b / COL_W));
    for (let i = i0; i <= i1; i++) {
      p.carry += pile[i];
      pile[i] = 0;             // scraped clean, no crust left behind
    }

    // Roll the load along in front of the blade. A plough pushes a long low bank, so
    // the snow goes down across the whole width of it and is capped at about blade
    // height; whatever will not fit is thrown clear rather than stacked into a tower.
    const cap = 26 * p.scale;
    const cols = Math.max(2, Math.round((86 * p.scale) / COL_W));
    const start = p.x + p.dir * 30 * p.scale;
    const dump = Math.min(p.carry, p.carry * Math.min(1, dt * 9) + 80 * dt);
    p.carry -= dump;

    let thrown = 0;
    for (let c = 0; c < cols; c++) {
      const share = dump / cols;
      const i = Math.floor((start + p.dir * c * COL_W) / COL_W);
      if (i < 0 || i >= pile.length) { thrown += share; continue; }
      const room = Math.max(0, cap - pile[i]);
      const add = Math.min(share, room);
      pile[i] += add;
      thrown += share - add;
    }
    if (thrown > 0.4) cast(p, thrown);

    // Anything you built in its way goes with it.
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      if (Math.abs(b.x - p.x) < 44 * p.scale && b.y + b.r > h - 90 * p.scale) {
        p.carry += (Math.PI * b.r * b.r) / COL_W * 0.6;
        balls.splice(i, 1);
      }
    }

    const off = 160 * p.scale;
    if (p.x < -off || p.x > w + off) {
      pile.fill(0);            // the bank goes off the edge with it; the screen is clear
      plow = null;
    }
  }

  // Snow thrown off the blade: real lumps, thrown up and forward, falling under the
  // same gravity as everything else and gone once they land. This is where the snow the
  // bank cannot hold actually goes.
  const spray = [];

  function cast(p, amount) {
    const lumps = Math.min(5, Math.ceil(amount * 0.5));
    for (let i = 0; i < lumps && spray.length < 90; i++) {
      spray.push({
        x: p.x + p.dir * rand(30, 46) * p.scale,
        y: h - rand(16, 30) * p.scale,
        vx: p.dir * rand(60, 190),
        vy: -rand(140, 300),
        r: rand(1, 2.8),
        life: 1
      });
    }
  }

  function updateSpray(dt) {
    for (let i = spray.length - 1; i >= 0; i--) {
      const s = spray[i];
      s.vy += G * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.life -= dt * 0.7;
      if (s.life <= 0 || s.y > h - 1 || s.x < -30 || s.x > w + 30) spray.splice(i, 1);
    }
  }

  function drawSpray() {
    if (!spray.length) return;
    ctx.fillStyle = "#ffffff";
    for (const s of spray) {
      ctx.globalAlpha = Math.min(1, Math.max(0, s.life));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPlow() {
    if (!plow) return;
    const p = plow, s = p.scale;

    ctx.save();
    ctx.translate(p.x, h - 2);
    ctx.scale(p.dir, 1);
    ctx.globalAlpha = 1;

    ctx.globalAlpha = 0.22;                          // shadow on the snow
    ctx.fillStyle = "#3b4a63";
    ctx.beginPath();
    ctx.ellipse(-2 * s, -2 * s, 46 * s, 5 * s, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;

    const beam = ctx.createLinearGradient(28 * s, -20 * s, 110 * s, -4 * s);
    beam.addColorStop(0, "rgba(255,238,185,0.32)");
    beam.addColorStop(1, "rgba(255,238,185,0)");
    ctx.fillStyle = beam;                            // headlights on the snow ahead
    ctx.beginPath();
    ctx.moveTo(26 * s, -24 * s);
    ctx.lineTo(108 * s, -34 * s);
    ctx.lineTo(108 * s, -1 * s);
    ctx.lineTo(26 * s, -12 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#e4532b";                       // blade
    ctx.beginPath();
    ctx.moveTo(30 * s, -2 * s);
    ctx.lineTo(53 * s, -30 * s);
    ctx.lineTo(61 * s, -24 * s);
    ctx.lineTo(39 * s, -2 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#e0851d";                       // chassis
    ctx.fillRect(-34 * s, -27 * s, 64 * s, 15 * s);
    ctx.fillStyle = "#f2a63a";                       // cab
    ctx.fillRect(2 * s, -45 * s, 26 * s, 19 * s);
    ctx.fillStyle = "#22303f";                       // window
    ctx.fillRect(7 * s, -41 * s, 16 * s, 11 * s);

    const on = (performance.now() % 760) < 380;      // beacon
    ctx.fillStyle = on ? "#ffd94f" : "#7a5f16";
    ctx.fillRect(11 * s, -51 * s, 8 * s, 6 * s);
    if (on) {
      ctx.globalAlpha = 0.18;
      ctx.beginPath();
      ctx.arc(15 * s, -48 * s, 22 * s, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = "#2a3341";                       // exhaust stack
    ctx.fillRect(-30 * s, -48 * s, 5 * s, 22 * s);

    const t = performance.now() / 1000;              // and its smoke
    ctx.fillStyle = "#ccd6e4";
    for (let puff = 0; puff < 3; puff++) {
      const age = (t * 1.5 + puff * 0.34) % 1;
      ctx.globalAlpha = (1 - age) * 0.22;
      ctx.beginPath();
      ctx.arc(-29 * s - age * 16 * s, -50 * s - age * 24 * s, (2 + age * 7) * s, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const wx of [-22, 14]) {                    // wheels turn with the distance
      ctx.fillStyle = "#171b22";
      ctx.beginPath();
      ctx.arc(wx * s, -8 * s, 8 * s, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = "#5d6775";
      ctx.lineWidth = 2 * s;
      ctx.beginPath();
      ctx.moveTo(wx * s, -8 * s);
      ctx.lineTo(wx * s + Math.cos(p.wheel) * 5.5 * s, -8 * s + Math.sin(p.wheel) * 5.5 * s);
      ctx.stroke();
    }

    ctx.restore();
  }

  // Sends itself out when the drift gets deep enough, if you asked it to.
  function maybeAutoPlow() {
    if (plow || !settings.autoPlowPercent) return;
    let deepest = 0;
    for (let i = 0; i < pile.length; i++) if (pile[i] > deepest) deepest = pile[i];
    if (deepest >= (settings.autoPlowPercent / 100) * h) window.sendPlow();
  }

  // Curves through the midpoints rather than joining column tops, so a surface reads
  // as snow instead of as a sawtooth. Used for the ground and for every window ledge.
  // A tile of speckle, built once and repeated across every snow surface. Snow is not
  // a flat colour: it is countless grains catching the light at different angles, and
  // without that it reads as paint.
  let grain = null;

  function makeGrain() {
    const size = 96;
    const tile = document.createElement("canvas");
    tile.width = tile.height = size;
    const g = tile.getContext("2d");
    const image = g.createImageData(size, size);
    for (let i = 0; i < image.data.length; i += 4) {
      const n = Math.random();
      const lit = n > 0.84, shaded = n < 0.16;
      const value = lit ? 255 : shaded ? 158 : 214;
      image.data[i] = image.data[i + 1] = image.data[i + 2] = value;
      image.data[i + 3] = lit ? 76 : shaded ? 48 : 16;
    }
    g.putImageData(image, 0, 0);
    return ctx.createPattern(tile, "repeat");
  }

  function surfacePath(arr, originX, baseY, i0, i1) {
    if (i1 <= i0) return false;
    ctx.beginPath();
    ctx.moveTo(originX + i0 * COL_W, baseY);
    ctx.lineTo(originX + i0 * COL_W, baseY - arr[i0]);
    for (let i = i0; i < i1; i++) {
      const x0 = originX + i * COL_W, x1 = originX + (i + 1) * COL_W;
      ctx.quadraticCurveTo(x0, baseY - arr[i], (x0 + x1) / 2, baseY - (arr[i] + arr[i + 1]) / 2);
    }
    ctx.lineTo(originX + i1 * COL_W, baseY - arr[i1]);
    ctx.lineTo(originX + i1 * COL_W, baseY);
    ctx.closePath();
    return true;
  }

  // Lying snow: a body that cools toward blue with depth, the grain over the top, and
  // a lit crest along the surface where it meets the air.
  function paintSnow(arr, originX, baseY, i0, i1) {
    if (!surfacePath(arr, originX, baseY, i0, i1)) return;

    const body = ctx.createLinearGradient(0, baseY - Math.max(40, h * 0.12), 0, baseY);
    body.addColorStop(0, "#ffffff");
    body.addColorStop(1, "#d6e1f1");
    ctx.fillStyle = body;
    ctx.fill();

    if (grain) { ctx.fillStyle = grain; ctx.fill(); }

    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 1.1;
    ctx.stroke();
  }

  // Light catching a facet here and there, which is what tells you a surface is snow
  // and not a sheet of paper.
  const sparkles = [];

  function updateSparkles(dt) {
    if (pile.length && sparkles.length < 20 && Math.random() < dt * 11) {
      const i = (Math.random() * pile.length) | 0;
      if (pile[i] > 2) {
        sparkles.push({ x: i * COL_W, y: h - pile[i] - 1, r: rand(0.7, 1.7), life: 1 });
      }
    }
    for (let i = sparkles.length - 1; i >= 0; i--) {
      sparkles[i].life -= dt * 1.5;
      if (sparkles[i].life <= 0) sparkles.splice(i, 1);
    }
  }

  function drawSparkles() {
    if (!sparkles.length) return;
    ctx.fillStyle = "#ffffff";
    for (const s of sparkles) {
      ctx.globalAlpha = Math.sin(Math.PI * Math.max(0, Math.min(1, s.life))) * 0.9;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPile() {
    if (!pile.length) return;
    if (!grain) grain = makeGrain();
    ctx.globalAlpha = 0.97;
    paintSnow(pile, 0, h, 0, pile.length - 1);

    // Snow lying on the top edge of every window, drawn only where that edge is not
    // covered by a window in front of it.
    for (const ledge of ledges.values()) {
      for (const span of ledge.spans) {
        const i0 = Math.max(0, Math.floor(span[0] / COL_W));
        const i1 = Math.min(ledge.snow.length - 1, Math.ceil(span[1] / COL_W));
        paintSnow(ledge.snow, ledge.x, ledge.y, i0, i1);
      }
    }
    ctx.globalAlpha = 1;
  }

  // Wind wanders slowly, so the fall never looks like it is on rails.
  let wind = 0, windGoal = rand(-22, 22), windTimer = 0;

  // Rendering budget. Snow does not need 60 or 120 Hz: at 30 fps the fall looks the
  // same and the GPU does half the work. The loop is driven by a timer that then asks
  // for one frame, so the process wakes ~30 times a second instead of once per display
  // refresh only to throw most of those frames away.
  const FPS_NORMAL = 30;
  let fps = FPS_NORMAL;
  let frameInterval = 1000 / fps;
  let timer = 0, raf = 0, fallback = 0;
  let last = performance.now();
  let lastDraw = last;
  let framesDrawn = 0;

  function schedule() {
    if (paused) return;
    clearTimeout(timer);
    timer = setTimeout(tick, frameInterval);
  }

  // requestAnimationFrame does not fire while WebKit considers the page hidden, and it
  // considers an overlay window hidden the moment another window covers it. Asking for
  // a frame and waiting for it therefore killed the loop outright when you switched
  // windows. So the timer owns the clock: rAF only lines the frame up with the display,
  // and if it has not answered in time we draw without it.
  function tick() {
    let drew = false;
    const draw = (now) => {
      if (drew) return;
      drew = true;
      clearTimeout(fallback);
      cancelAnimationFrame(raf);
      frame(now);
    };
    raf = requestAnimationFrame(draw);
    fallback = setTimeout(() => draw(performance.now()), Math.max(50, frameInterval));
  }

  // Last line of defence. If no frame has been drawn for a second and a half while the
  // snow is supposed to be falling, restart the loop: a frozen overlay is the one bug
  // nobody watching it can work around.
  setInterval(() => {
    if (!paused && performance.now() - lastDraw > 1500) schedule();
  }, 2000);

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    lastDraw = now;
    framesDrawn++;

    windTimer -= dt;
    if (windTimer <= 0) {
      windGoal = calm ? rand(-10, 10) : rand(-34, 34);
      windTimer = rand(3, 8);
    }
    wind += (windGoal - wind) * Math.min(dt * 0.5, 1);

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#ffffff";

    for (const b of buckets) b.length = 0;

    for (const f of flakes) {
      f.phase += f.spin * dt;

      // Gravity resisted by air: v' = g - (g/terminal²)·v², so a flake accelerates out
      // of the sky and levels off at its own terminal velocity rather than travelling
      // at a constant speed. Small flakes have more drag for their weight and hang.
      f.vy += (G - (G / (f.term * f.term)) * f.vy * f.vy) * dt;
      f.y += f.vy * dt;

      // Sideways it has momentum too: the wind and its own wobble are forces it lags
      // behind, which is why snow curls instead of sliding along straight lines.
      const push = wind * (0.3 + f.depth) + Math.sin(f.phase) * f.sway;
      f.vx += (push - f.vx) * Math.min(1, dt * 2.2);
      f.x += f.vx * dt;

      if (settings.settle && landOnLedge(f)) {
        Object.assign(f, makeFlake(false));
        continue;
      }

      // Landing on the drift rather than on the bottom of the screen.
      const ci = column(f.x);
      if (f.y + f.r >= h - pile[ci]) {
        land(ci, f.depth);
        Object.assign(f, makeFlake(false));
        continue;
      }
      if (f.x < -60) f.x = w + 50;
      else if (f.x > w + 60) f.x = -50;

      buckets[f.bucket].push(f);
    }

    for (let b = 0; b < BUCKETS; b++) {
      const list = buckets[b];
      if (!list.length) continue;
      ctx.globalAlpha = (b + 0.5) / BUCKETS;
      ctx.beginPath();
      for (const f of list) {
        if (f.crystal) continue;
        ctx.moveTo(f.x + f.r, f.y);   // moveTo first, or arcs chain into one stroke
        ctx.arc(f.x, f.y, f.r, 0, TAU);
      }
      ctx.fill();

      // Close to the glass a flake is not a dot: it is six arms, turning as it falls.
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = Math.max(0.7, 0.4 + b * 0.18);
      ctx.lineCap = "round";
      ctx.beginPath();
      for (const f of list) {
        if (!f.crystal) continue;
        for (let arm = 0; arm < 3; arm++) {
          const angle = f.phase * 0.4 + (arm * Math.PI) / 3;
          const dx = Math.cos(angle) * f.r * 1.45;
          const dy = Math.sin(angle) * f.r * 1.45;
          ctx.moveTo(f.x - dx, f.y - dy);
          ctx.lineTo(f.x + dx, f.y + dy);
        }
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    updatePlow(dt);
    maybeAutoPlow();
    updateSpray(dt);
    updateSparkles(dt);
    settle(dt);
    updateBalls(dt);
    drawPile();
    drawBalls();
    drawPlow();
    drawSparkles();
    drawSpray();

    schedule();
  }
  schedule();

  // While the overlay is hidden, the display is asleep or the Mac is locked there is
  // nothing to draw: the app calls setPaused(true) and the loop stops dead instead of
  // animating snow nobody can see.
  window.setPaused = (p) => {
    paused = !!p;
    clearTimeout(timer);
    clearTimeout(fallback);
    cancelAnimationFrame(raf);
    if (!paused) {
      last = performance.now();
      lastDraw = last;
      schedule();          // always rearm: resuming must never depend on prior state
    }
  };

  // The page's own visibility is not a usable stop signal for an overlay — WebKit calls
  // it hidden while the window is merely covered — so it only ever nudges the loop back
  // into life, never out of it.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !paused) schedule();
  });

  // Called when the Mac moves to battery or Low Power Mode: fewer flakes, fewer
  // frames, fewer pixels. It is still visibly snowing.
  const FPS_SAVER = 20;

  // Someone who has asked the system for less motion should not be handed a blizzard.
  // It still snows — that is the whole point — but gently, and at a lower rate.
  function updateFrameRate() {
    fps = calm ? 20 : powerSaver ? FPS_SAVER : FPS_NORMAL;
    frameInterval = 1000 / fps;
  }

  calmQuery.addEventListener("change", (event) => {
    calm = event.matches;
    updateFrameRate();
    sync(false);
  });

  window.setPowerSaver = (on) => {
    on = !!on;
    if (on === powerSaver) return;
    powerSaver = on;
    updateFrameRate();
    resize();
    sync(false);
  };

  // Settings arrive from the macOS app, which owns them. Changing how long a drift
  // takes re-paces the accumulation from the next second onwards.
  window.applySettings = (next) => {
    Object.assign(settings, next || {});
    applyDepthCap();
  };

  // For ci/check-page.swift: enough to tell whether the engine is alive.
  window.__snowState = () => ({ flakes: flakes.length, frames: framesDrawn });

  window.clearPile = () => {
    pile.fill(0);
    balls.length = 0;
    for (const ledge of ledges.values()) ledge.snow.fill(0);
  };
  window.getPile = () => Array.from(pile);
  window.setPile = (heights) => {
    if (!Array.isArray(heights) || !heights.length) return;
    for (let i = 0; i < pile.length; i++) {
      pile[i] = heights[Math.min(heights.length - 1, Math.floor(i * heights.length / pile.length))];
    }
  };

  // Called from the browser (keys 1/2/3) and from the macOS app's menu bar.
  window.setIntensity = (level) => {
    intensity = PRESETS[level] ?? PRESETS[2];
    sync(false);
  };
  window.addEventListener("keydown", (e) => {
    if (e.key === "1" || e.key === "2" || e.key === "3") window.setIntensity(Number(e.key));
    if (e.key === "p" || e.key === "P") window.sendPlow();
  });
})();
</script>
</body>
</html>
