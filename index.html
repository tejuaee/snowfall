<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snowfall</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  /* Standalone demo in a normal browser gets a night sky so white flakes are visible.
     The macOS overlay loads index.html?overlay=1 and stays fully transparent. */
  body.demo { background: radial-gradient(120% 90% at 50% 0%, #1b2a4a 0%, #0a0f1c 60%, #05070d 100%); }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hint {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    font: 500 13px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif;
    color: #cfe0ff; opacity: .55; letter-spacing: .02em; text-align: center;
    pointer-events: none; display: none;
  }
  body.demo .hint { display: block; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<p class="hint">Press 1 / 2 / 3 to change how hard it snows</p>
<script>
(() => {
  "use strict";
  const overlay = new URLSearchParams(location.search).has("overlay");
  if (!overlay) document.body.classList.add("demo");

  const canvas = document.getElementById("sky");
  const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });

  // Snow that has landed, as a height in pixels every COL_W across the screen. This is
  // deliberately slow: at the default rate a Medium snowfall lays down roughly 15px an
  // hour, so a proper drift along the bottom of the screen is an evening's work.
  const COL_W = 4;
  const REPOSE = Math.tan(38 * Math.PI / 180) * 4;   // snow holds a ~38° face
  let pile = new Float32Array(0);
  let pileCap = 0;

  // Everything the native side (or the settings window) is allowed to change.
  const settings = {
    pileRate: 0.35,      // px of depth per landed flake
    plowSpeed: 260,      // px per second
    plowScale: 1,
    autoPlowDepth: 0,    // 0 = never plough on its own
    plowDirection: 0     // 0 alternate, 1 left to right, -1 right to left
  };

  let w = 0, h = 0, dpr = 1;
  let powerSaver = false;
  let paused = false;

  // Backing-store pixels are the biggest single GPU cost here. Small white dots do not
  // need the full Retina scale, so cap at 1.5x, or 1x while saving power: on a 5K
  // display that is well under half the pixels of a naive devicePixelRatio canvas.
  function dprCap() { return powerSaver ? 1 : 1.5; }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, dprCap());
    const cw = Math.floor(window.innerWidth * dpr);
    const ch = Math.floor(window.innerHeight * dpr);
    if (cw === canvas.width && ch === canvas.height) return false;
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = cw;
    canvas.height = ch;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // a resize clears the canvas and its transform
    rebuildPile();
    return true;
  }

  // Resizing reallocates the backing store, and a window dragged between displays
  // fires dozens of resize events, so coalesce bursts into one rebuild.
  let resizeTimer = 0;
  function onViewportChange() {
    if (resize()) sync(false);
  }
  resize();
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(onViewportChange, 150);
  });

  // Flake count scales with the area of the screen, so a 6K display is not sparse.
  const TAU = Math.PI * 2;
  const G = 400;                // px/s² — gravity, in screen units
  // Flakes are drawn in a few fixed opacities rather than one each, so a frame is a
  // handful of fills instead of three canvas state changes per flake.
  const BUCKETS = 5;
  const buckets = Array.from({ length: BUCKETS }, () => []);

  const PRESETS = { 1: 0.45, 2: 1, 3: 2.2 };
  let intensity = 1;
  let flakes = [];

  const rand = (a, b) => a + Math.random() * (b - a);

  function targetCount() {
    return Math.round((w * h) / 9000 * intensity * (powerSaver ? 0.55 : 1));
  }

  function makeFlake(seeded) {
    // depth: 0 = far away (small, slow, faint), 1 = close to the glass
    const depth = Math.pow(Math.random(), 1.6);
    return {
      x: rand(-40, w + 40),
      y: seeded ? rand(-h, h) : rand(-60, -10),
      depth,
      r: 0.7 + depth * 2.6,
      term: 14 + depth * 46,          // terminal velocity, px/s — big flakes fall faster
      vy: seeded ? 14 + depth * 46 : 0,
      vx: 0,
      sway: rand(10, 34) * (0.4 + depth),
      phase: rand(0, Math.PI * 2),
      spin: rand(0.4, 1.3),
      bucket: Math.min(BUCKETS - 1, Math.floor((0.28 + depth * 0.62) * BUCKETS))
    };
  }

  function sync(seeded) {
    const want = targetCount();
    while (flakes.length < want) flakes.push(makeFlake(seeded));
    if (flakes.length > want) flakes.length = want;
  }
  sync(true);

  // ---- snow on the ground -------------------------------------------------

  // Keeps whatever has already settled when the screen changes size, by resampling the
  // old heights across the new column count rather than throwing away the drift.
  function rebuildPile() {
    const n = Math.max(1, Math.ceil(w / COL_W));
    const next = new Float32Array(n);
    if (pile.length) {
      for (let i = 0; i < n; i++) {
        next[i] = pile[Math.min(pile.length - 1, Math.floor(i * pile.length / n))];
      }
    }
    pile = next;
    pileCap = h * 0.28;          // never swallow more than the bottom quarter
  }

  function column(x) {
    if (x < 0) return 0;
    if (x >= w) return pile.length - 1;
    return (x / COL_W) | 0;
  }

  function land(ci, depth) {
    if (pile[ci] < pileCap) pile[ci] += settings.pileRate * (0.45 + depth);
  }

  // Snow does not stand in towers: anything steeper than REPOSE slumps onto its
  // neighbour, which is also what spreads out the ridge a plough leaves behind.
  function settle(dt) {
    const give = Math.min(1, dt * 9) * 0.25;
    for (let i = 0; i < pile.length - 1; i++) {
      const d = pile[i] - pile[i + 1];
      if (d > REPOSE) {
        const move = (d - REPOSE) * give;
        pile[i] -= move; pile[i + 1] += move;
      } else if (d < -REPOSE) {
        const move = (-d - REPOSE) * give;
        pile[i] += move; pile[i + 1] -= move;
      }
    }
  }

  function drawPile() {
    if (!pile.length) return;
    ctx.globalAlpha = 0.96;
    ctx.fillStyle = "#f2f6ff";
    ctx.beginPath();
    ctx.moveTo(0, h);
    for (let i = 0; i < pile.length; i++) ctx.lineTo(i * COL_W, h - pile[i]);
    ctx.lineTo(w, h - pile[pile.length - 1]);
    ctx.lineTo(w, h);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Wind wanders slowly, so the fall never looks like it is on rails.
  let wind = 0, windGoal = rand(-22, 22), windTimer = 0;

  // Rendering budget. Snow does not need 60 or 120 Hz: at 30 fps the fall looks the
  // same and the GPU does half the work. The loop is driven by a timer that then asks
  // for one frame, so the process wakes ~30 times a second instead of once per display
  // refresh only to throw most of those frames away.
  const FPS_NORMAL = 30;
  let fps = FPS_NORMAL;
  let frameInterval = 1000 / fps;
  let timer = 0, raf = 0, fallback = 0;
  let last = performance.now();
  let lastDraw = last;

  function schedule() {
    if (paused) return;
    clearTimeout(timer);
    timer = setTimeout(tick, frameInterval);
  }

  // requestAnimationFrame does not fire while WebKit considers the page hidden, and it
  // considers an overlay window hidden the moment another window covers it. Asking for
  // a frame and waiting for it therefore killed the loop outright when you switched
  // windows. So the timer owns the clock: rAF only lines the frame up with the display,
  // and if it has not answered in time we draw without it.
  function tick() {
    let drew = false;
    const draw = (now) => {
      if (drew) return;
      drew = true;
      clearTimeout(fallback);
      cancelAnimationFrame(raf);
      frame(now);
    };
    raf = requestAnimationFrame(draw);
    fallback = setTimeout(() => draw(performance.now()), Math.max(50, frameInterval));
  }

  // Last line of defence. If no frame has been drawn for a second and a half while the
  // snow is supposed to be falling, restart the loop: a frozen overlay is the one bug
  // nobody watching it can work around.
  setInterval(() => {
    if (!paused && performance.now() - lastDraw > 1500) schedule();
  }, 2000);

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    lastDraw = now;

    windTimer -= dt;
    if (windTimer <= 0) { windGoal = rand(-34, 34); windTimer = rand(3, 8); }
    wind += (windGoal - wind) * Math.min(dt * 0.5, 1);

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#ffffff";

    for (const b of buckets) b.length = 0;

    for (const f of flakes) {
      f.phase += f.spin * dt;

      // Gravity resisted by air: v' = g - (g/terminal²)·v², so a flake accelerates out
      // of the sky and levels off at its own terminal velocity rather than travelling
      // at a constant speed. Small flakes have more drag for their weight and hang.
      f.vy += (G - (G / (f.term * f.term)) * f.vy * f.vy) * dt;
      f.y += f.vy * dt;

      // Sideways it has momentum too: the wind and its own wobble are forces it lags
      // behind, which is why snow curls instead of sliding along straight lines.
      const push = wind * (0.3 + f.depth) + Math.sin(f.phase) * f.sway;
      f.vx += (push - f.vx) * Math.min(1, dt * 2.2);
      f.x += f.vx * dt;

      // Landing on the drift rather than on the bottom of the screen.
      const ci = column(f.x);
      if (f.y + f.r >= h - pile[ci]) {
        land(ci, f.depth);
        Object.assign(f, makeFlake(false));
        continue;
      }
      if (f.x < -60) f.x = w + 50;
      else if (f.x > w + 60) f.x = -50;

      buckets[f.bucket].push(f);
    }

    for (let b = 0; b < BUCKETS; b++) {
      const list = buckets[b];
      if (!list.length) continue;
      ctx.globalAlpha = (b + 0.5) / BUCKETS;
      ctx.beginPath();
      for (const f of list) {
        ctx.moveTo(f.x + f.r, f.y);   // moveTo first, or arcs chain into one stroke
        ctx.arc(f.x, f.y, f.r, 0, TAU);
      }
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    settle(dt);
    drawPile();

    schedule();
  }
  schedule();

  // While the overlay is hidden, the display is asleep or the Mac is locked there is
  // nothing to draw: the app calls setPaused(true) and the loop stops dead instead of
  // animating snow nobody can see.
  window.setPaused = (p) => {
    paused = !!p;
    clearTimeout(timer);
    clearTimeout(fallback);
    cancelAnimationFrame(raf);
    if (!paused) {
      last = performance.now();
      lastDraw = last;
      schedule();          // always rearm: resuming must never depend on prior state
    }
  };

  // The page's own visibility is not a usable stop signal for an overlay — WebKit calls
  // it hidden while the window is merely covered — so it only ever nudges the loop back
  // into life, never out of it.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !paused) schedule();
  });

  // Called when the Mac moves to battery or Low Power Mode: fewer flakes, fewer
  // frames, fewer pixels. It is still visibly snowing.
  const FPS_SAVER = 20;
  window.setPowerSaver = (on) => {
    on = !!on;
    if (on === powerSaver) return;
    powerSaver = on;
    fps = powerSaver ? FPS_SAVER : FPS_NORMAL;
    frameInterval = 1000 / fps;
    resize();
    sync(false);
  };

  // Called from the browser (keys 1/2/3) and from the macOS app's menu bar.
  window.setIntensity = (level) => {
    intensity = PRESETS[level] ?? PRESETS[2];
    sync(false);
  };
  window.addEventListener("keydown", (e) => {
    if (e.key === "1" || e.key === "2" || e.key === "3") window.setIntensity(Number(e.key));
  });
})();
</script>
</body>
</html>
